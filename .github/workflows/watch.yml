name: Acompanhar jogo ao vivo

on:
  schedule:
    # A cada 20 min entre 16h e 04h UTC (13h-01h de Brasília), faixa que cobre
    # os horários de jogo no Brasil.
    #
    # O cron só serve pra DESCOBRIR que o jogo começou — ele atrasa de 5 a 20
    # min, o que arruinaria o aviso de gol. Quando acha jogo, o job entra em
    # loop e faz as checagens por dentro, no intervalo exato configurado.
    # Sem jogo, o job sai em segundos.
    - cron: '*/20 16-23,0-4 * * *'
  workflow_dispatch:

concurrency:
  # Nunca dois acompanhamentos ao mesmo tempo: o segundo duplicaria os avisos.
  group: botafogo-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    # Teto do GitHub Actions é 360 min; 240 dá folga sobre os 210 do bot.
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Acompanhar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          TZ: America/Sao_Paulo
          POLL_INTERVAL_SECONDS: '90'
        run: node --no-warnings=ExperimentalWarning src/index.js watch

      - name: Salvar estado
        # Roda mesmo se o passo anterior falhar, pra não reenviar avisos.
        if: always()
        run: |
          # Só state.json. Durante um jogo o workflow de comandos está
          # commitando a cada 5 min; mexer no mesmo arquivo daria conflito
          # de rebase justamente aqui, e os gols sairiam repetidos.
          if [[ -n "$(git status --porcelain data/state.json)" ]]; then
            git config user.name  "botafogo-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/state.json
            git commit -m "estado: acompanhamento [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "Nada mudou no estado."
          fi
