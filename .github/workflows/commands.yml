name: Responder comandos

on:
  schedule:
    # 5 min é o intervalo mínimo que o GitHub aceita. Na prática o cron
    # atrasa, então a resposta chega em ~5-15 min. Não dá pra fazer melhor
    # sem um servidor ligado o tempo todo (veja "Limitação" no README).
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  # Duas execuções ao mesmo tempo responderiam o mesmo comando duas vezes.
  group: botafogo-commands
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Responder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: America/Sao_Paulo
        run: node --no-warnings=ExperimentalWarning src/index.js commands

      - name: Salvar sessão
        if: always()
        run: |
          # Grava SÓ session.json. O state.json pertence aos workflows de
          # jogo — se os dois mexessem no mesmo arquivo, o rebase daria
          # conflito no meio da partida e os gols sairiam repetidos.
          if [[ -n "$(git status --porcelain data/session.json)" ]]; then
            git config user.name  "botafogo-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/session.json
            git commit -m "sessão: comandos [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "Nenhum comando novo."
          fi
