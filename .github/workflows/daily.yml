name: Aviso diário de jogo

on:
  schedule:
    # 11:00 UTC = 08:00 em Brasília. O cron do GitHub costuma atrasar alguns
    # minutos, o que aqui não faz diferença nenhuma.
    - cron: '0 11 * * *'
  workflow_dispatch: # permite rodar na mão pelo botão "Run workflow"

# Impede que duas execuções mexam no state.json ao mesmo tempo.
concurrency:
  group: botafogo-state
  cancel-in-progress: false

permissions:
  contents: write # pra gravar o state.json de volta no repositório

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Avisar se tem jogo hoje
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: America/Sao_Paulo
        run: node --no-warnings=ExperimentalWarning src/index.js digest

      - name: Salvar estado
        run: |
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git config user.name  "botafogo-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/
            git commit -m "estado: aviso diário [skip ci]"
            # Outro job pode ter commitado enquanto este rodava.
            git pull --rebase --autostash
            git push
          else
            echo "Nada mudou no estado."
          fi
